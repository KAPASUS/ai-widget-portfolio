<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Jhonny Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
#assistant-container{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:9999999;
  font-family:Inter,system-ui,Arial;
}

#assistant-button{
  width:96px;
  height:96px;
  background:#fff;
  border-radius:50%;
  border:2px solid #0f3d3e;
  color:#0f3d3e;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  cursor:pointer;
}

#assistant{
  width:360px;
  background:#fff;
  border-radius:14px;
  border:1px solid #ddd;
  box-shadow:0 12px 40px rgba(0,0,0,.15);
  padding:14px;
  display:none;
}

#header{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  color:#0f3d3e;
}

#close{cursor:pointer}

#log{
  margin:10px 0;
  background:#fafafa;
  border:1px solid #eee;
  border-radius:10px;
  padding:8px;
  height:220px;
  overflow:auto;
}

.msg{
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  font-size:14px;
}

.user{background:#e6f2ff;text-align:right}
.bot{background:#fff;border:1px solid #eee}

#input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  color:#111;
}

#send{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#0f3d3e;
  color:#fff;
  cursor:pointer;
}

/* Animations */
@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(2px,0)}
  50%{transform:translate(-2px,0)}
  75%{transform:translate(2px,0)}
  100%{transform:translate(0,0)}
}
@keyframes bounce{
  0%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
  100%{transform:translateY(0)}
}
.shake{animation:shake .4s infinite}
.shake-bounce{animation:shake .4s infinite, bounce .8s infinite}
</style>
</head>

<body>

<div id="assistant-container">
  <div id="assistant-button">Jhonny</div>

  <div id="assistant">
    <div id="header">
      <span>Little Jhonny – Virtual Assistant</span>
      <span id="close">✕</span>
    </div>

    <div id="log"></div>

    <input id="input" placeholder="Ask a question">
    <button id="send">Send</button>
  </div>
</div>

<script>
/* ================== FAQ (60 QUESTIONS) ================== */
const faq = [
  {k:["projects","design","work","type","do"],a:"I specialize in modern web design, clean interfaces, and clear digital experiences."},
  {k:["tools","software","programs","use","design"],a:"I work with Figma, Photoshop, Illustrator, Webflow and advanced prototyping tools."},
  {k:["style","design","main","approach"],a:"My style is minimalist, balanced and user-focused."},
  {k:["adapt","adjust","brand","style","identity"],a:"Yes, I adapt my design style to each brand’s identity and strategy."},
  {k:["responsive","mobile","tablet","devices"],a:"Yes, all my designs adapt to mobile, tablet and desktop."},
  {k:["redesign","existing","website","improve"],a:"Yes, I analyze what works and redesign it to be clearer and more effective."},
  {k:["delivery","time","project","weeks"],a:"Depending on scope, usually between 1 and 4 weeks."},
  {k:["ux","wireframes","flows","architecture"],a:"Yes, I include information architecture, user flows and wireframes."},
  {k:["branding","logos","identity","visual","design"],a:"Yes, I can design or refine basic branding and logos."},
  {k:["international","clients","remote","work"],a:"Yes, I work remotely with clients worldwide."},
  {k:["portfolio","examples","work","projects"],a:"You can see selected projects directly in my portfolio."},
  {k:["maintenance","website","support"],a:"Yes, if the project requires ongoing maintenance."},
  {k:["process","design","workflow","steps"],a:"My process includes briefing, wireframes, visual design, review and final delivery."},
  {k:["start","brand","scratch","zero"],a:"Yes, I can build a brand and website from scratch."},
  {k:["animations","microinteractions","motion","design"],a:"Yes, I implement subtle animations without hurting performance."},
  {k:["pricing","budget","cost","charge"],a:"I work with fixed project-based pricing."},
  {k:["difference","designer","unique","why"],a:"I focus on clarity, UX and strong visual detail."},
  {k:["development","webflow","build","code"],a:"Yes, I can deliver fully built Webflow websites."},
  {k:["seo","optimization","search","performance"],a:"I apply basic SEO and structure optimization."},
  {k:["contact","email","reach","hire"],a:"You can contact me via the form or email."},
  {k:["urgent","rush","fast","project"],a:"Yes, if my schedule allows it."},
  {k:["mobile","apps","application","design"],a:"Yes, I have designed hybrid app experiences."},
  {k:["audit","review","design","analysis"],a:"Yes, I offer design audits with actionable improvements."},
  {k:["visual","content","graphics","icons"],a:"Yes, I create visual assets and supporting graphics."},

  /* Technical / UX */
  {k:["html","css","javascript","coding","programming"],a:"I have basic knowledge and rely heavily on AI-assisted workflows."},
  {k:["interactive","prototypes","functional","testing"],a:"Yes, I build interactive functional prototypes."},
  {k:["frameworks","react","angular","vue"],a:"No, I mainly work with Figma and Webflow."},
  {k:["developers","collaboration","handoff","team"],a:"Yes, I collaborate closely with developers."},
  {k:["cms","wordpress","shopify","webflow"],a:"I mainly work with Webflow."},
  {k:["performance","speed","optimization","load"],a:"Yes, I optimize layouts for performance."},
  {k:["information","architecture","structure","ux"],a:"I organize content logically based on user goals."},
  {k:["usability","testing","users","feedback"],a:"Yes, I run usability tests with real users."},
  {k:["metrics","kpis","measure","ux"],a:"I measure usability, clarity and task completion."},
  {k:["accessibility","wcag","inclusive","design"],a:"I follow accessibility best practices."},
  {k:["decision","solutions","design","choice"],a:"I choose the most efficient solution for users."},

  /* Collaboration / Strategy */
  {k:["teams","multidisciplinary","collaboration","experience"],a:"Yes, I have worked in multidisciplinary teams."},
  {k:["feedback","clients","reviews","process"],a:"I manage feedback through staged reviews."},
  {k:["documentation","guidelines","design","system"],a:"I document decisions and visual rules."},
  {k:["prioritization","deadlines","time","management"],a:"I prioritize tasks and manage workload carefully."},
  {k:["business","goals","strategy","balance"],a:"Business goals always come first, then refinement."},
  {k:["ecommerce","applications","commerce","apps"],a:"I have designed hybrid app experiences."},
  {k:["funnel","conversion","users","flow"],a:"I design flows that guide users toward goals."},
  {k:["research","competition","trends","analysis"],a:"I research competitors directly and observe trends."},
  {k:["learning","trends","ux","technology"],a:"I stay updated through professionals and industry content."},
  {k:["ai","ar","voice","technology"],a:"Yes, I experiment heavily with AI and emerging tech."},

  /* Personal (single keyword match) */
  {k:["name"],a:"My name is Juan Lucero."},
  {k:["age"],a:"I am 36 years old."},
  {k:["nationality"],a:"I am Italo-Argentinian."},
  {k:["munich"],a:"I have been living in Munich since 2021."}
];

/* ================== ENGINE ================== */
const log=document.getElementById("log");
const input=document.getElementById("input");

function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

function reply(q){
  const w=q.toLowerCase().split(/\W+/);
  for(const f of faq){
    let c=0;
    f.k.forEach(k=>{if(w.includes(k))c++;});
    if(c>=2 || (f.k.length===1 && c===1)) return f.a;
  }
  return "Please rephrase your question.";
}

document.getElementById("send").onclick=()=>{
  if(!input.value.trim())return;
  add(input.value,"user");
  add(reply(input.value),"bot");
  input.value="";
};

/* UI */
const btn=document.getElementById("assistant-button");
const panel=document.getElementById("assistant");
const close=document.getElementById("close");

btn.onclick=()=>{btn.style.display="none";panel.style.display="block";}
close.onclick=()=>{panel.style.display="none";btn.style.display="flex";}

/* Intro animation */
setTimeout(()=>btn.classList.add("shake"),2000);
setTimeout(()=>{
  btn.classList.remove("shake");
  btn.classList.add("shake-bounce");
},4500);
setTimeout(()=>{
  btn.classList.remove("shake-bounce");
  btn.click();
},6000);
</script>

</body>
</html>
